services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/shopexpress
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p shopexpress 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  usuarios:
    build: ./usuarios-service
    ports:
      - "8001:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      PEDIDOS_URL: http://pedidos:8000
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  catalogo:
    build: ./catalogo-service
    ports:
      - "8002:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: shopexpress
    depends_on:
      mongo:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  pedidos:
    build: ./pedidos-service
    ports:
      - "8003:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      USUARIOS_URL: http://usuarios:8000
      CATALOGO_URL: http://catalogo:8000
    depends_on:
      mongo:
        condition: service_healthy
      usuarios:
        condition: service_healthy
      catalogo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo-data:
  neo4j-data:
